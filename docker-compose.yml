# Mercovia — Docker Compose stack (EC2 production variant)
#
# Runs client + server + socket-relay, plus a local Redis used only for
# internal coordination between server and socket-relay (sessions,
# socket-auth tickets, pub/sub for real-time events).
#
# MongoDB is intentionally NOT containerized — the app connects to your
# existing external MongoDB (e.g. MongoDB Atlas), exactly like the
# Vercel deployment does. Set MONGO_URI in your .env.
#
# All app ports (3000/3001/4000) are bound to 127.0.0.1 only. Nginx,
# running directly on the EC2 host, is the sole public entry point on
# port 80. This keeps the backend and socket-relay unreachable from the
# internet even if someone probes the instance's IP directly.

services:
  redis:
    image: redis:7-alpine
    container_name: mercovia-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mercovia-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mercovia-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # NODE_ENV=development (not "production") is intentional here too:
      # it keeps auth cookies as sameSite=lax/secure=false, required
      # because this deployment serves plain http:// (no TLS/domain yet).
      # The server still runs the compiled production JavaScript
      # (dist/server.js) — this only affects cookie flags and the JWT
      # dev-secret fallback, not which code runs. Switch to "production"
      # once you put a real domain + HTTPS in front of this (see §11).
      NODE_ENV: development
      PORT: 3001
      FRONTEND_URL: ${PUBLIC_ORIGIN}
      MONGO_URI: ${MONGO_URI}
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      REFRESH_TOKEN: ${REFRESH_TOKEN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRES: ${JWT_EXPIRES:-5}
      ACCESS_TOKEN_EXPIRE: ${ACCESS_TOKEN_EXPIRE:-2}
      REFRESH_TOKEN_EXPIRE: ${REFRESH_TOKEN_EXPIRE:-24}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      COMPANY_NAME: ${COMPANY_NAME:-Mercovia}
      SMPT_HOST: ${SMPT_HOST}
      SMPT_PORT: ${SMPT_PORT:-587}
      SMTP_SERVICE: ${SMTP_SERVICE}
      SMTP_MAIL: ${SMTP_MAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - mercovia-network

  socket-relay:
    build:
      context: ./socket-relay
      dockerfile: Dockerfile
    container_name: mercovia-socket-relay
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${PUBLIC_ORIGIN}
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - mercovia-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        DOCKER_BUILD: "1"
        # Server-side rewrite target — reaches the "server" container
        # directly over the internal Docker network. Never exposed to
        # the browser.
        BACKEND_API_URL: http://server:3001/api/v1
        # Browser-facing values.
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_SOCKET_URL: ${PUBLIC_ORIGIN}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_ORIGIN}
    container_name: mercovia-client
    restart: unless-stopped
    depends_on:
      - server
      - socket-relay
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - mercovia-network

networks:
  mercovia-network:
    driver: bridge