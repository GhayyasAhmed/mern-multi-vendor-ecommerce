# Mercovia — Docker Compose stack (EC2 production variant)
#
# Runs mongodb + redis + server + socket-relay + client.
#
# MongoDB is now a containerized service on this EC2 host with a named
# volume (mongodb_data) for persistent storage, authentication enabled,
# and no published host port — only containers on mercovia-network can
# reach it.
#
# All app ports (3000/3001/4000) stay bound to 127.0.0.1 only. Nginx,
# running directly on the EC2 host, is the sole public entry point on
# ports 80/443, fronting three subdomains:
#   mercovia.online / www.mercovia.online -> client       (:3000)
#   api.mercovia.online                   -> server       (:3001)
#   socket.mercovia.online                -> socket-relay (:4000)

services:
  mongodb:
    image: mongo:7
    container_name: mercovia-mongodb
    restart: unless-stopped
    command: ["--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: mercovia
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mercovia-network

  redis:
    image: redis:7-alpine
    container_name: mercovia-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mercovia-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mercovia-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: ${PUBLIC_ORIGIN}
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/mercovia?authSource=admin
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN: ${ACCESS_TOKEN}
      REFRESH_TOKEN: ${REFRESH_TOKEN}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRES: ${JWT_EXPIRES:-5}
      ACCESS_TOKEN_EXPIRE: ${ACCESS_TOKEN_EXPIRE:-2}
      REFRESH_TOKEN_EXPIRE: ${REFRESH_TOKEN_EXPIRE:-24}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-usd}
      COMPANY_NAME: ${COMPANY_NAME:-Mercovia}
      SMPT_HOST: ${SMPT_HOST}
      SMPT_PORT: ${SMPT_PORT:-587}
      SMTP_SERVICE: ${SMTP_SERVICE}
      SMTP_MAIL: ${SMTP_MAIL}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - mercovia-network

  socket-relay:
    build:
      context: ./socket-relay
      dockerfile: Dockerfile
    container_name: mercovia-socket-relay
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: ${PUBLIC_ORIGIN}
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - mercovia-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        DOCKER_BUILD: "1"
        BACKEND_API_URL: http://server:3001/api/v1
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_SOCKET_URL: ${SOCKET_ORIGIN}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_ORIGIN}
    container_name: mercovia-client
    restart: unless-stopped
    depends_on:
      - server
      - socket-relay
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - mercovia-network

networks:
  mercovia-network:
    driver: bridge

volumes:
  mongodb_data: