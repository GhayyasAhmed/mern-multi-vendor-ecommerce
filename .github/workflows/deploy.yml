name: Deploy to EC2

on:
  push:
    branches:
      - feature/ssl-domains-deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Docker Compose configuration
        run: docker compose config > /dev/null
        env:
          MONGO_ROOT_USER: validation-only
          MONGO_ROOT_PASSWORD: validation-only
          PUBLIC_ORIGIN: https://mercovia.online
          SOCKET_ORIGIN: https://socket.mercovia.online
          ACCESS_TOKEN: validation-only
          REFRESH_TOKEN: validation-only
          JWT_SECRET_KEY: validation-only
          ENCRYPTION_KEY: validation-only
          CLOUDINARY_CLOUD_NAME: validation-only
          CLOUDINARY_API_KEY: validation-only
          CLOUDINARY_API_SECRET: validation-only
          STRIPE_SECRET_KEY: validation-only
          STRIPE_PUBLISHABLE_KEY: validation-only
          STRIPE_WEBHOOK_SECRET: validation-only
          SMPT_HOST: validation-only
          SMTP_SERVICE: validation-only
          SMTP_MAIL: validation-only
          SMTP_PASSWORD: validation-only
          ADMIN_EMAIL: validation-only
          ADMIN_PASSWORD: validation-only

      - name: Prepare SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts || true
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          echo "Debugging EC2_APP_DIR value: '${EC2_APP_DIR}'"
          # Safety check to ensure the variable isn't empty before proceeding
          if [ -z "$EC2_APP_DIR" ]; then
            echo "Error: EC2_APP_DIR secret is missing or empty!"
            exit 1
          fi
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$EC2_USER@$EC2_HOST" REMOTE_APP_DIR="$EC2_APP_DIR" 'bash -s' << 'EOF'
            set -e
            cd "$REMOTE_APP_DIR"
            echo "== Fetching latest branch =="
            git fetch origin feature/ssl-domains-deployment
            git checkout -f feature/ssl-domains-deployment
            git reset --hard origin/feature/ssl-domains-deployment
            
            echo "== Rebuilding and starting containers =="
            docker compose up -d --build --remove-orphans
            
            echo "== Cleaning up unused images =="
            docker image prune -f
            
            echo "== Deployment completed successfully =="
          EOF

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/deploy_key
        
      - name: Verify backend health endpoint
        run: |
          curl -fsS "http://${{ secrets.EC2_HOST }}/api/v1/health-check"
          echo ""
          echo "Backend health check passed"

      - name: Verify frontend responds
        run: |
          STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" "http://${{ secrets.EC2_HOST }}/")
          if [ "$STATUS" != "200" ]; then
            echo "Frontend returned HTTP $STATUS instead of 200"
            exit 1
          fi
          echo "Frontend check passed (HTTP 200)"