# deploy/nginx/mercovia.conf
#
# Reverse proxy for the Mercovia Docker stack. Runs directly on the EC2
# host (not in Docker) and is the sole public entry point (ports 80/443),
# fronting three subdomains with Let's Encrypt TLS:
#   mercovia.online / www.mercovia.online -> client       (:3000)
#   api.mercovia.online                   -> server       (:3001)
#   socket.mercovia.online                -> socket-relay (:4000)

upstream mercovia_client {
    server 127.0.0.1:3000;
}
upstream mercovia_server {
    server 127.0.0.1:3001;
}
upstream mercovia_socket {
    server 127.0.0.1:4000;
}

# ---------- mercovia.online / www ----------
server {
    listen 80;
    listen [::]:80;
    server_name mercovia.online www.mercovia.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://mercovia.online$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mercovia.online;

    ssl_certificate     /etc/letsencrypt/live/mercovia.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mercovia.online/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://mercovia.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mercovia.online;

    ssl_certificate     /etc/letsencrypt/live/mercovia.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mercovia.online/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    client_max_body_size 15m;

    location / {
        proxy_pass http://mercovia_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---------- api.mercovia.online ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.mercovia.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://api.mercovia.online$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mercovia.online;

    ssl_certificate     /etc/letsencrypt/live/mercovia.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mercovia.online/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    client_max_body_size 15m;

    location / {
        proxy_pass http://mercovia_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- socket.mercovia.online ----------
server {
    listen 80;
    listen [::]:80;
    server_name socket.mercovia.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://socket.mercovia.online$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name socket.mercovia.online;

    ssl_certificate     /etc/letsencrypt/live/mercovia.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mercovia.online/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://mercovia_socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}