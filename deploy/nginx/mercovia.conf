# deploy/nginx/mercovia.conf
#
# Reverse proxy for the Mercovia Docker stack.
#   /socket.io/  -> socket-relay container (WebSocket upgrade required —
#                   the client is configured for transports: ["websocket"]
#                   only, no polling fallback, so this is not optional)
#   everything else -> client (Next.js) container, which itself proxies
#                   /api/v1/* on to the backend container over the
#                   internal Docker network (see next.config.ts rewrites)

upstream mercovia_client {
    server 127.0.0.1:3000;
}

upstream mercovia_socket {
    server 127.0.0.1:4000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;   # catch-all — no IP/domain hardcoded here on purpose

    client_max_body_size 15m;  # base64 image uploads (avatars/products)

    location /socket.io/ {
        proxy_pass http://mercovia_socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location / {
        proxy_pass http://mercovia_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}